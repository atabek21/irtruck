<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IR-TRUCK">
<title>IR-TRUCK</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1c1e21;--mu:#6b7280;--br:#d9dce1;--ac:#2563eb;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--card:#1f2328;--tx:#e8eaed;--mu:#9aa0a6;--br:#343a41;--ac:#5b8def;--ok:#3ec16f;--bad:#f06060;--warn:#f0a030;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171a;--card:#1f2328;--tx:#e8eaed;--mu:#9aa0a6;--br:#343a41;--ac:#5b8def;--ok:#3ec16f;--bad:#f06060;--warn:#f0a030;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:960px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{min-width:90px}
.tabs button{flex:1;padding:10px;border:1px solid var(--br);background:var(--card);color:var(--tx);border-radius:8px;font-size:15px;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.c{background:var(--card);border:1px solid var(--br);border-radius:10px;padding:12px;margin-bottom:12px}
input,select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--br);border-radius:6px;padding:9px;font-size:16px;max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:9px 14px;font-size:15px;cursor:pointer}
.btn.g{background:transparent;color:var(--bad);border:1px solid var(--br);padding:5px 9px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--br);white-space:nowrap}
th{font-size:12px;color:var(--mu);font-weight:600}
td input{width:80px;padding:5px}
td input.n{width:64px}
.q0{color:var(--bad);font-weight:700}.q1{color:var(--warn);font-weight:700}
.pay{display:flex;gap:6px;flex-wrap:wrap}
.pay label{border:1px solid var(--br);border-radius:8px;padding:9px 14px;cursor:pointer;background:var(--bg);flex-direction:row;font-size:15px;color:var(--tx)}
.pay input{display:none}
.pay label.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.st div{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--mu)}
.st b{display:block;font-size:18px;color:var(--tx)}
.msg{color:var(--ok);min-height:20px;margin-top:8px}
.mu{color:var(--mu);font-size:13px}
</style>
<script src="config.js"></script>
<script src="sb.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="w">
<h1>IR-TRUCK <span class="mu" id="cs" style="font-size:12px;font-weight:400"></span></h1>
<div class="tabs" id="tabs"></div>
<div id="app"></div>
</div>
<script>
var KEY="sklad_v1",PAYS=["Наличные","Перевод","Терминал"];
var S={items:[],sales:[]},tab="stock",q="",pay="Наличные",msg="";
var d0=day(Date.now()),from=d0,to=d0;
function seed(){var a=[["Рулевой подшипник",8],["Подшипник 6201",10],["Подшипник 6200",0],["Подшипник 6203",9],["Подшипник 6004",2],["Подшипник 6204",3],["2 поршня колодки (золотистые)",9],["2 поршня комплект",5],["Обычные колодки",9],["Куго колодки",2],["У2 Саига колодки",9],["Экранная ручка газа",3],["Новый переключатель",18],["Куго В3 Про контроллер",1],["Куго В3 Про Плюс контроллер",1],["У2 контроллер",1],["Лиминг контроллер новый",4],["Венбокс В3 Про контроллер",1]];
return a.map(function(r,i){return{id:i+1,name:r[0],qty:r[1],price:0,cost:0}})}
function load(){try{var r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);S.recs=S.recs||[];S.works=S.works||[];fix();return}}catch(e){}S={items:seed(),sales:[],recs:[],works:[]};fix()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}cloud2()}
var DB=null,tmr=null,lastW={};
function mon(t){return day(t).slice(0,7)}
function setCs(t){var e=document.getElementById("cs");if(e)e.textContent=t}
function cloudSave(){if(!DB)return;clearTimeout(tmr);tmr=setTimeout(function(){var w={"shop/items":{items:S.items}},m={};S.sales.forEach(function(s){var k=mon(s.ts);(m[k]=m[k]||[]).push(s)});Object.keys(m).forEach(function(k){w["sales/"+k]={list:m[k]}});Object.keys(lastW).forEach(function(p){if(p.indexOf("sales/")==0&&!w[p])w[p]={list:[]}});
Promise.all(Object.keys(w).filter(function(p){return JSON.stringify(w[p])!=lastW[p]}).map(function(p){var j=JSON.stringify(w[p]);return DB.doc(p).set(JSON.parse(j)).then(function(){lastW[p]=j})})).then(function(){setCs("☁ сохранено")}).catch(function(){setCs("сохранено только в этом браузере")})},500)}
function cloudInit(){try{if(!window.claude||!claude.use)return;claude.use("db").then(function(d){if(!d){setCs("сохранено только в этом браузере");return}DB=d;setCs("☁ подключаюсь…");var done=false;setTimeout(function(){if(!done)setCs("облако недоступно, работаю в браузере")},10000);return Promise.all([d.doc("shop/items").get(),d.collection("sales").get()]).then(function(r){done=true;if(r[0].exists){S.items=JSON.parse(JSON.stringify(r[0].data().items||[]));var a=[];r[1].docs.forEach(function(x){a=a.concat(JSON.parse(JSON.stringify(x.data().list||[])))});S.sales=a;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}setCs("☁ данные загружены");render()}else{setCs("☁ первое сохранение");cloudSave()}})}).catch(function(){setCs("сохранено только в этом браузере")})}catch(e){}}
var pendK=null,cloudOk=null,PEND=0;window.addEventListener("beforeunload",function(e){if(PEND>0){e.preventDefault();e.returnValue=""}});
function ask(k,fn){if(pendK===k){pendK=null;fn();return}pendK=k;render();setTimeout(function(){if(pendK===k){pendK=null;render()}},4000)}
function sj(o){return JSON.stringify(o,Object.keys(o).sort())}
function cp(o){return JSON.parse(JSON.stringify(o))}
function bad(p){delete lastW[p];setCs("⚠ не сохранено: нет прав на запись. Проверьте вход и настройки базы")}
function cloud2(){if(!DB)return;var w={};S.items.forEach(function(i){w["ir_items/"+i.id]=i});S.sales.forEach(function(s){w["ir_sales/"+s.id]=s});S.recs.forEach(function(s){w["ir_recs/"+s.id]=s});S.works.forEach(function(s){w["ir_works/"+s.id]=s});EX.forEach(function(k){S[k].forEach(function(s){w["ir_"+k+"/"+s.id]=s})});
Object.keys(w).forEach(function(p){var j=sj(w[p]);if(lastW[p]!==j){lastW[p]=j;PEND++;setCs("сохраняю…");DB.doc(p).set(cp(w[p])).then(function(){if(--PEND<=0)setCs("☁ сохранено")}).catch(function(){PEND--;bad(p)})}});
Object.keys(lastW).forEach(function(p){if(!w[p]){delete lastW[p];DB.doc(p).delete().then(function(){setCs("☁ сохранено")}).catch(function(){setCs("⚠ не удалось удалить")})}})}
function snap(pre,key,sn){if(!sn.docs.length&&key=="items")return;Object.keys(lastW).forEach(function(p){if(p.indexOf(pre+"/")==0)delete lastW[p]});var a=[];sn.docs.forEach(function(x){var o=cp(x.data());a.push(o);lastW[pre+"/"+x.id]=sj(o)});a.sort(function(x,y){return x.id-y.id});S[key]=a;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}var e=document.activeElement;if(!(e&&/INPUT|TEXTAREA|SELECT/.test(e.tagName)))render()}
function init2(){setTimeout(function(){if(cloudOk!==true){cloudOk=false;render()}},12000);try{if(!window.claude||!claude.use)return;claude.use("db").then(function(d){if(!d){cloudOk=false;setCs("только в этом браузере");render();return}setCs("☁ подключаюсь…");
return Promise.all([d.collection("ir_items").get(),d.collection("ir_sales").get(),d.doc("shop/items").get(),d.collection("sales").get()]).then(function(r){DB=d;cloudOk=true;setInterval(cloud2,15000);
if(!r[0].docs.length){if(r[2].exists){S.items=cp(r[2].data().items||[]);var a=[];r[3].docs.forEach(function(x){if(x.data().list)a=a.concat(cp(x.data().list))});S.sales=a}cloud2()}
d.collection("ir_items").onSnapshot(function(s){snap("ir_items","items",s);setCs("☁ подключено, данные общие")},function(){setCs("облако недоступно")});
d.collection("ir_sales").onSnapshot(function(s){snap("ir_sales","sales",s)},function(){});d.collection("ir_recs").onSnapshot(function(s){snap("ir_recs","recs",s)},function(){});d.collection("ir_works").onSnapshot(function(s){snap("ir_works","works",s)},function(){});EX.forEach(function(k){d.collection("ir_"+k).onSnapshot(function(s){snap("ir_"+k,k,s)},function(){})})})}).catch(function(){setCs("сохранено только в этом браузере")})}catch(e){}}
function hm(t){var x=new Date(t);return String(x.getHours()).padStart(2,"0")+":"+String(x.getMinutes()).padStart(2,"0")}
function addWork(){var m=$("wm").value.trim(),d=$("wd").value.trim(),p=+$("wp").value;if(!m||!d||!(p>0)){$("wmsg").textContent="Укажите мастера, что сделано и цену";return}var ii=item($("wi").value),qq=+$("wq").value||1,pp=$("wpp").value;if(ii&&qq>ii.qty){$("wmsg").textContent="Запчасти на складе только "+ii.qty;return}S.works.push({id:nextId(),ts:Date.now(),master:m,desc:d,price:p,pay:pay});if(ii){ii.qty-=qq;if(pp!==""&&+pp>0)ii.price=+pp;S.sales.push({id:nextId(),ts:Date.now(),itemId:ii.id,name:ii.name,qty:qq,price:pp===""?ii.price:+pp,cost:ii.cost,pay:pay})}save();render();var e=$("wmsg");if(e)e.textContent="Записано: "+m+" — "+d+" — "+money(p)+" ("+pay+")"}
function delWork(id){ask("w"+id,function(){S.works=S.works.filter(function(y){return y.id!=id});save();render()})}
function mLine(l){var m={};l.forEach(function(w){m[w.master]=(m[w.master]||0)+w.price});var k=Object.keys(m);return k.length?'<p class="mu">По мастерам: '+k.map(function(x){return esc(x)+" — "+money(m[x])}).join("; ")+'</p>':''}
function worksTable(l){return'<div class="tw"><table><tr><th>Дата</th><th>Мастер</th><th>Работа</th><th>Цена</th><th>Оплата</th><th></th></tr>'+l.map(function(w){return'<tr><td>'+day(w.ts).split("-").reverse().join(".")+" "+hm(w.ts)+'</td><td>'+esc(w.master)+'</td><td>'+esc(w.desc)+'</td><td>'+money(w.price)+'</td><td>'+w.pay+'</td><td><button class="btn g" onclick="delWork('+w.id+')">'+(pendK=="w"+w.id?"Точно отменить?":"Отменить")+'</button></td></tr>'}).join("")+(l.length?'':'<tr><td colspan="6" class="mu">Работ нет</td></tr>')+'</table></div>'}
function wk(){var x=new Date(),g=(x.getDay()+6)%7,a=new Date(x.getFullYear(),x.getMonth(),x.getDate()-g),b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+6);return[day(a.getTime()),day(b.getTime())]}
var mf=wk()[0],mt=wk()[1],mp=50;
function masData(){var l=S.works.filter(function(w){var d=day(w.ts);return d>=mf&&d<=mt}).sort(function(a,b){return a.ts-b.ts}),m={};l.forEach(function(w){var o=m[w.master]||(m[w.master]={n:w.master,c:0,sum:0});o.c++;o.sum+=w.price});var arr=Object.keys(m).map(function(k){return m[k]}),tot=0,pt=0;arr.forEach(function(o){o.pct=pc(o.n);o.pay=Math.round(o.sum*o.pct)/100;o.paid=paidFor(o.n);o.left=Math.round((o.pay-o.paid)*100)/100;tot+=o.sum;pt+=o.pay});return{l:l,arr:arr,tot:tot,pt:pt}}
function masText(){var r=masData(),t="IR-TRUCK\nРасчёт с мастерами\n"+mf.split("-").reverse().join(".")+" — "+mt.split("-").reverse().join(".")+" (доля мастера "+mp+"%)\n\n";r.arr.forEach(function(o){t+=o.n+": работ "+o.c+", на "+money(o.sum)+" ("+o.pct+"%), к выплате "+money(o.pay)+", выплачено "+money(o.paid)+"\n"});if(!r.arr.length)t+="работ не было\n";else t+="\nВсего к выплате: "+money(r.pt)+"\n";return t.trim()}
function vMas(){var r=masData();LA=r.arr;var h='<div class="c"><div class="row"><label>С<input type="date" value="'+mf+'" onchange="mf=this.value||mf;render()"></label><label>По<input type="date" value="'+mt+'" onchange="mt=this.value||mt;render()"></label><label>Доля мастера, %<input type="number" min="0" max="100" value="'+mp+'" style="width:90px" onchange="mp=+this.value||0;render()"></label><label>Чем платим<select onchange="mpay=this.value">'+["Наличные","Перевод"].map(function(p){return'<option'+(mpay==p?" selected":"")+'>'+p+'</option>'}).join("")+'</select></label></div><p class="mu" style="margin:8px 0 0">Показана текущая неделя (понедельник — воскресенье). Считаются только работы мастеров, товары не входят.</p></div>';
h+='<div class="st"><div>Работ на сумму<b>'+money(r.tot)+'</b></div><div>Мастерам к выплате<b>'+money(r.pt)+'</b></div><div>Остаётся магазину<b>'+money(r.tot-r.pt)+'</b></div></div>';
h+='<div class="c"><div class="tw"><table><tr><th>Мастер</th><th>%</th><th>Работ</th><th>Сумма работ</th><th>К выплате</th><th>Выплачено</th><th></th></tr>'+r.arr.map(function(o,i){return'<tr><td>'+esc(o.n)+'</td><td><input class="n" type="number" value="'+o.pct+'" onchange="setPct('+i+',this.value)"></td><td>'+o.c+'</td><td>'+money(o.sum)+'</td><td><b>'+money(o.pay)+'</b></td><td>'+money(o.paid)+'</td><td>'+(o.left>0?'<button class="btn" onclick="payM('+i+')">'+(pendK=="p"+i?"Точно?":"Выплатить "+money(o.left))+'</button>':'✓')+'</td></tr>'}).join("")+(r.arr.length?'':'<tr><td colspan="4" class="mu">За этот период работ нет</td></tr>')+'</table></div></div>';
var pp=S.pays.filter(function(x){return x.from==mf&&x.to==mt});h+='<div class="c"><b>Выплаты за этот период</b><div class="tw"><table>'+pp.map(function(x){return'<tr><td>'+day(x.ts).split("-").reverse().join(".")+'</td><td>'+esc(x.master)+'</td><td>'+money(x.amt)+'</td><td>'+x.pay+'</td><td><button class="btn g" onclick="delPay('+x.id+')">'+(pendK=="y"+x.id?"Точно отменить?":"Отменить")+'</button></td></tr>'}).join("")+(pp.length?'':'<tr><td class="mu">Выплат пока нет</td></tr>')+'</table></div></div>';
h+='<div class="c"><b>Работы за период</b>'+worksTable(r.l)+'</div>';
h+='<div class="c"><b>Текст для выплаты</b><textarea id="mx" rows="8" style="width:100%;margin-top:8px">'+esc(masText())+'</textarea><p><button class="btn" onclick="copyMas()">Скопировать</button></p><div class="msg" id="mcm"></div></div>';return h}
function copyMas(){var t=$("mx");t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}try{document.execCommand("copy")}catch(e){}$("mcm").textContent="Скопировано"}
var EX=["exps","pays","cfg","bikes","rents","bcost","dpay"],LA=[],mpay="Наличные";
function fix(){EX.forEach(function(k){S[k]=S[k]||[]})}
function mn(i){return i.min==null?2:i.min}
function pc(n){var c=S.cfg.filter(function(x){return x.master==n})[0];return c?c.pct:mp}
function paidFor(n){var s=0;S.pays.forEach(function(p){if(p.master==n&&p.from==mf&&p.to==mt)s+=p.amt});return s}
function tsOf(d){return d==day(Date.now())?Date.now():new Date(d+"T12:00:00").getTime()}
function cashN(r){var o={cin:r.by["Наличные"]||0,cex:0,ex:0,cpay:0};r.el.forEach(function(x){o.ex+=x.amt;if(x.pay=="Наличные")o.cex+=x.amt});r.pl.forEach(function(x){if(x.pay=="Наличные")o.cpay+=x.amt});o.net=o.cin-o.cex-o.cpay;return o}
function addExp(){var d=$("ed").value.trim(),a=+$("ea").value;if(!d||!(a>0))return;S.exps.push({id:nextId(),ts:tsOf(rd),desc:d,amt:a,pay:$("ep").value});save();render()}
function delExp(id){ask("e"+id,function(){S.exps=S.exps.filter(function(x){return x.id!=id});save();render()})}
function delPay(id){ask("y"+id,function(){S.pays=S.pays.filter(function(x){return x.id!=id});save();render()})}
function payM(i){var o=LA[i];if(!o||!(o.left>0))return;ask("p"+i,function(){S.pays.push({id:nextId(),ts:Date.now(),master:o.n,amt:o.left,pay:mpay,from:mf,to:mt});save();render()})}
function setPct(i,v){var n=LA[i].n,c=S.cfg.filter(function(x){return x.master==n})[0];if(c)c.pct=+v||0;else S.cfg.push({id:nextId(),master:n,pct:+v||0});save();render()}
function cashCard(r){var c=cashN(r);return'<div class="c"><b>Касса и расходы за день</b><div class="st" style="margin-top:8px"><div>Наличные принято<b>'+money(c.cin)+'</b></div><div>Расходы наличными<b>'+money(c.cex)+'</b></div><div>Выплаты мастерам наличными<b>'+money(c.cpay)+'</b></div><div>Касса за день (+/−)<b>'+money(c.net)+'</b></div></div><div class="row"><label>Расход<input id="ed" placeholder="Например: аренда" style="width:220px"></label><label>Сумма<input id="ea" type="number" min="0" style="width:100px"></label><label>Чем заплатили<select id="ep"><option>Наличные</option><option>Перевод</option></select></label><button class="btn" onclick="addExp()">Записать расход</button></div><div class="tw"><table>'+r.el.map(function(x){return'<tr><td>'+esc(x.desc)+'</td><td>'+money(x.amt)+'</td><td>'+x.pay+'</td><td><button class="btn g" onclick="delExp('+x.id+')">'+(pendK=="e"+x.id?"Точно отменить?":"Отменить")+'</button></td></tr>'}).join("")+'</table></div></div>'}
function pickW(){var i=item($("wi").value);$("wpp").value=i&&i.price?i.price:"";$("wpp").placeholder=i&&!i.price?"цена не задана, впишите":"как на складе"}
var bv=0;
function bikeNum(id){var b=S.bikes.filter(function(x){return x.id==id})[0];return b?b.num:"?"}
function bikeOut(id){return S.rents.some(function(x){return x.bikeId==id&&!x.back})}
function payBlock(){return'<div class="pay">'+PAYS.map(function(p){return'<label class="'+(pay==p?"on":"")+'" onclick="pay=\''+p+'\';markPay()">'+p+'</label>'}).join("")+'</div>'}
function addBike(){var n=$("bn").value.trim(),m=$("bm").value.trim();if(!n)return;if(S.bikes.some(function(b){return b.num==n})){$("bmsg").textContent="Велосипед с таким номером уже есть";return}S.bikes.push({id:nextId(),num:n,model:m});save();render()}
function delBike(id){ask("b"+id,function(){var ri={};S.rents.forEach(function(x){if(x.bikeId==id)ri[x.id]=1});S.dpay=S.dpay.filter(function(d){return!ri[d.rentId]});S.rents=S.rents.filter(function(x){return x.bikeId!=id});S.bcost=S.bcost.filter(function(x){return x.bikeId!=id});S.bikes=S.bikes.filter(function(x){return x.id!=id});save();render()})}
function rentOut(){var b=$("rb").value,c=$("rc").value.trim(),ph=$("rph").value.trim(),a=+$("ra").value;if(!b||!c||!(a>0)){$("bmsg").textContent="Выберите велосипед, впишите клиента и сумму";return}var pr=$("rpd").value,pd=pr===""?a:Math.min(+pr||0,a);S.rents.push({id:nextId(),ts:Date.now(),bikeId:+b,client:c,phone:ph,amt:a,paid:pd,pay:pay,back:0});save();render()}
